name: Weather forecasts

on:
  schedule:
    - cron: '0 22 * * *' # daily at 22:00 UTC (06:00 Manila)
  workflow_dispatch: {}

jobs:
  forecasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/weather/requirements.txt
      - name: Run forecasts pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python external-data-scraper/weather/pipeline.py --mode forecasts
