name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Schedule Strategy (free tier optimized & daily scraping):
#
# We split the Facebook pages into 4 batches (A, B, C, D).
# To ensure all pages are scanned every single day, we run:
#
#   Morning Run   (6:00 AM PHT / 22:00 UTC): Batches A and B (14 pages total)
#   Afternoon Run (3:00 PM PHT / 07:00 UTC): Batches C and D (17 pages total)
#
# By reducing the DEFAULT_MAX_SCROLLS to 3 and using conditional page
# loading fallbacks, each page scan is optimized to ~50 seconds.
# This runs all pages daily in ~32 minutes total, consuming ~960 minutes
# per month, which is well under the 2,000-minute free tier budget.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Morning run — 6:00 AM PHT = 22:00 UTC (day before in UTC)
    - cron: '0 22 * * *'
    # Afternoon run — 3:00 PM PHT = 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (A, B, C, D, or all)'
        required: false
        default: 'all'

jobs:
  scrape-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Determine Batch
        id: batch_select
        run: |
          # If manually triggered with a specific batch, use it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH="${{ github.event.inputs.batch }}"
            echo "batch=${BATCH}" >> $GITHUB_OUTPUT
            echo "Manually triggered: Batch ${BATCH}"
            exit 0
          fi

          # Determine which batches to run based on the hour of trigger (all batches daily)
          HOUR=$(date -u +%H)
          HOUR_NUM=$((10#$HOUR))

          if [ "$HOUR_NUM" -ge 15 ] || [ "$HOUR_NUM" -le 2 ]; then
            # Morning run (6 AM PHT / 22:00 UTC) -> Run Batches A and B
            BATCH="A,B"
          else
            # Afternoon run (3 PM PHT / 07:00 UTC) -> Run Batches C and D
            BATCH="C,D"
          fi

          echo "batch=${BATCH}" >> $GITHUB_OUTPUT
          echo "Scheduled run: Hour ${HOUR} UTC → Batches ${BATCH}"

      - name: Run Events Pipeline
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER:         ${{ secrets.FB_C_USER }}
          FB_XS:             ${{ secrets.FB_XS }}
          FB_DATR:           ${{ secrets.FB_DATR }}
          FB_FR:             ${{ secrets.FB_FR }}
          FB_SB:             ${{ secrets.FB_SB }}
          FB_C_USER_1:       ${{ secrets.FB_C_USER_1 }}
          FB_XS_1:           ${{ secrets.FB_XS_1 }}
          FB_DATR_1:         ${{ secrets.FB_DATR_1 }}
          FB_FR_1:           ${{ secrets.FB_FR_1 }}
          FB_SB_1:           ${{ secrets.FB_SB_1 }}
          FB_C_USER_2:       ${{ secrets.FB_C_USER_2 }}
          FB_XS_2:           ${{ secrets.FB_XS_2 }}
          FB_DATR_2:         ${{ secrets.FB_DATR_2 }}
          FB_FR_2:           ${{ secrets.FB_FR_2 }}
          FB_SB_2:           ${{ secrets.FB_SB_2 }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ steps.batch_select.outputs.batch }}"
          echo "Running pipeline for Batch: ${BATCH}"
          python pipeline.py "${BATCH}"
