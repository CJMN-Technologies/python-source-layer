name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Tiered Scraping Schedule (Budget: ~$1.29/day = ~$40/month)
#
# Apify billing: Pay per event at $0.005/result (confirmed from dashboard).
#
# 3 runs per day, each with a purpose-built role (scheduled at off-peak minutes to avoid GitHub Actions runner queue contention):
#   4:18 AM PHT (20:18 UTC) → STRONG  (24hr window, ~150 posts, ~$0.75)
#   11:23 AM PHT (03:23 UTC) → MEDIUM  (8hr window,  ~72 posts,  ~$0.36)
#   4:14 PM PHT (08:14 UTC) → LIGHT   (4hr window,  ~36 posts,  ~$0.18)
#
# Total daily: ~258 posts → ~$1.29/day → ~$40/month
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '18 20 * * *'
    - cron: '23 3 * * *'
    - cron: '14 8 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (Eastbound, Westbound, or all)'
        required: false
        default: 'all'
      mode:
        description: 'Scrape mode (strong, medium, or light)'
        required: false
        default: 'medium'

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt

            - name: Determine scrape mode
                    id: scrape_mode
                            run: |
                                      # For manual triggers, use the input value
                                                if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                                                            echo "mode=${{ github.event.inputs.mode || 'strong' }}" >> $GITHUB_OUTPUT
                                                                        echo "Using manual mode: ${{ github.event.inputs.mode || 'strong' }}"
                                                                                    exit 0
                                                                                              fi
                                                                                              
                                                                                                        # For scheduled triggers, determine mode based on github.event.schedule to handle runner delays robustly
                                                                                                                  SCHEDULE="${{ github.event.schedule }}"
                                                                                                                            echo "Scheduled cron: $SCHEDULE"
                                                                                                                                      if [ "$SCHEDULE" = "18 20 * * *" ]; then
                                                                                                                                                  echo "mode=strong" >> $GITHUB_OUTPUT
                                                                                                                                                              echo '4:18 AM PHT cron triggered -> STRONG mode (24hr window, ~150 posts, ~$0.75)'
                                                                                                                                                                        elif [ "$SCHEDULE" = "23 3 * * *" ]; then
                                                                                                                                                                                    echo "mode=medium" >> $GITHUB_OUTPUT
                                                                                                                                                                                                echo '11:23 AM PHT cron triggered -> MEDIUM mode (8hr window, ~72 posts, ~$0.36)'
                                                                                                                                                                                                          elif [ "$SCHEDULE" = "14 8 * * *" ]; then
                                                                                                                                                                                                                      echo "mode=light" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                  echo '4:14 PM PHT cron triggered -> LIGHT mode (4hr window, ~36 posts, ~$0.18)'
                                                                                                                                                                                                                                            else
                                                                                                                                                                                                                                                        echo "mode=medium" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                    echo "Unknown cron ($SCHEDULE), defaulting to MEDIUM"
                                                                                                                                                                                                                                                                              fi
                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                              - name: Run Events Pipeline
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:  ${{ secrets.GEMINI_API_KEY_3 }}
          APIFY_API_TOKEN:   ${{ secrets.APIFY_API_TOKEN }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ github.event.inputs.batch || 'all' }}"
          MODE="${{ steps.scrape_mode.outputs.mode }}"
          echo "Running pipeline → Batch: ${BATCH}, Mode: ${MODE}"
          python pipeline.py "${BATCH}" --mode "${MODE}"
