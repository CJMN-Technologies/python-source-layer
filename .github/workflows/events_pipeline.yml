name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Tiered Scraping Schedule (Budget: ~$1.29/day = ~$40/month)
#
# Apify billing: Pay per event at $0.005/result (confirmed from dashboard).
#
# Triggered externally via cron-job.org for exact timing (no GitHub cron delays):
#   4:00 AM PHT  → STRONG  (24hr window, ~150 posts, ~$0.75)
#   11:00 AM PHT → MEDIUM  (8hr window,  ~72 posts,  ~$0.36)
#   4:00 PM PHT  → LIGHT   (4hr window,  ~36 posts,  ~$0.18)
#
# Total daily: ~258 posts → ~$1.29/day → ~$40/month
#
# NOTE: GitHub's built-in cron scheduler was removed due to unreliable
# delays (up to 6 hours). cron-job.org triggers workflow_dispatch via
# GitHub API for exact-second precision.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (Eastbound, Westbound, or all)'
        required: false
        default: 'all'
      mode:
        description: 'Scrape mode (strong, medium, or light)'
        required: false
        default: 'medium'

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt

      - name: Determine scrape mode
        id: scrape_mode
        run: |
          MODE="${{ github.event.inputs.mode || 'strong' }}"
          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "Scrape mode: ${MODE}"

      - name: Run Events Pipeline
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:  ${{ secrets.GEMINI_API_KEY_3 }}
          APIFY_API_TOKEN:   ${{ secrets.APIFY_API_TOKEN }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ github.event.inputs.batch || 'all' }}"
          MODE="${{ steps.scrape_mode.outputs.mode }}"
          echo "Running pipeline → Batch: ${BATCH}, Mode: ${MODE}"
          python pipeline.py "${BATCH}" --mode "${MODE}"
