name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Schedule Strategy (free tier optimized):
#
# We split ~28 Facebook pages into 4 batches (A, B, C, D) of ~7 pages each.
# Two batches run per day in an alternating pattern based on the day of month:
#
#   Odd days  (1,3,5,...): Morning → Batch A | Afternoon → Batch C
#   Even days (2,4,6,...): Morning → Batch B | Afternoon → Batch D
#
# This ensures every page is scraped every 2 days — well within the 7-day
# post window — and no page is treated as higher priority than another.
#
# Budget: 2 runs/day × ~22 min × 30 days ≈ 1,320 min/month (< 2,000 free tier)
#
# Time references (PHT = UTC+8):
#   Morning run   → 6:00 AM PHT = 22:00 UTC (previous calendar day)
#   Afternoon run → 3:00 PM PHT = 07:00 UTC
# ---------------------------------------------------------------------------

on:
  schedule:
    # Morning run — 6:00 AM PHT = 22:00 UTC (day before in UTC)
    - cron: '0 22 * * *'
    # Afternoon run — 3:00 PM PHT = 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (A, B, C, D, or all)'
        required: false
        default: 'all'

jobs:
  scrape-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Determine Batch
        id: batch_select
        run: |
          # If manually triggered with a specific batch, use it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH="${{ github.event.inputs.batch }}"
            echo "batch=${BATCH}" >> $GITHUB_OUTPUT
            echo "Manually triggered: Batch ${BATCH}"
            exit 0
          fi

          # Determine which batches to run based on time and day parity
          HOUR=$(date -u +%H)
          DAY=$(date -u +%d)
          DAY_NUM=$((10#$DAY))  # Remove leading zeros
          IS_ODD=$(( DAY_NUM % 2 ))

          if [ "$HOUR" -eq 22 ]; then
            # Morning run (6 AM PHT)
            if [ "$IS_ODD" -eq 1 ]; then
              BATCH="A"
            else
              BATCH="B"
            fi
          else
            # Afternoon run (3 PM PHT)
            if [ "$IS_ODD" -eq 1 ]; then
              BATCH="C"
            else
              BATCH="D"
            fi
          fi

          echo "batch=${BATCH}" >> $GITHUB_OUTPUT
          echo "Scheduled run: Day ${DAY_NUM} ($([ $IS_ODD -eq 1 ] && echo 'odd' || echo 'even')), Hour ${HOUR} UTC → Batch ${BATCH}"

      - name: Run Events Pipeline
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER:         ${{ secrets.FB_C_USER }}
          FB_XS:             ${{ secrets.FB_XS }}
          FB_DATR:           ${{ secrets.FB_DATR }}
          FB_FR:             ${{ secrets.FB_FR }}
          FB_SB:             ${{ secrets.FB_SB }}
          FB_C_USER_1:       ${{ secrets.FB_C_USER_1 }}
          FB_XS_1:           ${{ secrets.FB_XS_1 }}
          FB_DATR_1:         ${{ secrets.FB_DATR_1 }}
          FB_FR_1:           ${{ secrets.FB_FR_1 }}
          FB_SB_1:           ${{ secrets.FB_SB_1 }}
          FB_C_USER_2:       ${{ secrets.FB_C_USER_2 }}
          FB_XS_2:           ${{ secrets.FB_XS_2 }}
          FB_DATR_2:         ${{ secrets.FB_DATR_2 }}
          FB_FR_2:           ${{ secrets.FB_FR_2 }}
          FB_SB_2:           ${{ secrets.FB_SB_2 }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ steps.batch_select.outputs.batch }}"
          echo "Running pipeline for Batch: ${BATCH}"
          python pipeline.py "${BATCH}"
