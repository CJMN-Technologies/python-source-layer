name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Schedule Strategy (free tier optimized & daily scraping):
#
# We run Eastbound and Westbound concurrently using a matrix strategy.
# Runs 3 times a day:
#   4:00 AM PHT (20:00 UTC)
#   11:00 AM PHT (03:00 UTC)
#   4:00 PM PHT (08:00 UTC)
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (Eastbound, Westbound, or all)'
        required: false
        default: 'all'

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [Eastbound, Westbound]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('external-data-scraper/scraper/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Determine Batch
        id: batch_select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.batch }}" != "all" ]; then
              if [ "${{ github.event.inputs.batch }}" != "${{ matrix.batch }}" ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "batch=${{ matrix.batch }}" >> $GITHUB_OUTPUT

      - name: Run Events Pipeline
        if: steps.batch_select.outputs.skip == 'false'
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER:         ${{ secrets.FB_C_USER }}
          FB_XS:             ${{ secrets.FB_XS }}
          FB_DATR:           ${{ secrets.FB_DATR }}
          FB_FR:             ${{ secrets.FB_FR }}
          FB_SB:             ${{ secrets.FB_SB }}
          FB_C_USER_1:       ${{ secrets.FB_C_USER_1 }}
          FB_XS_1:           ${{ secrets.FB_XS_1 }}
          FB_DATR_1:         ${{ secrets.FB_DATR_1 }}
          FB_FR_1:           ${{ secrets.FB_FR_1 }}
          FB_SB_1:           ${{ secrets.FB_SB_1 }}
          FB_C_USER_2:       ${{ secrets.FB_C_USER_2 }}
          FB_XS_2:           ${{ secrets.FB_XS_2 }}
          FB_DATR_2:         ${{ secrets.FB_DATR_2 }}
          FB_FR_2:           ${{ secrets.FB_FR_2 }}
          FB_SB_2:           ${{ secrets.FB_SB_2 }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ steps.batch_select.outputs.batch }}"
          echo "Running pipeline for Batch: ${BATCH}"
          python pipeline.py "${BATCH}"
