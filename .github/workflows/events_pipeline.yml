name: Smart Events Scraper Pipeline

on:
  schedule:
    # Runs at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Events Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          FB_DATR: ${{ secrets.FB_DATR }}
          FB_FR: ${{ secrets.FB_FR }}
          FB_SB: ${{ secrets.FB_SB }}
          FB_C_USER_1: ${{ secrets.FB_C_USER_1 }}
          FB_XS_1: ${{ secrets.FB_XS_1 }}
          FB_DATR_1: ${{ secrets.FB_DATR_1 }}
          FB_FR_1: ${{ secrets.FB_FR_1 }}
          FB_SB_1: ${{ secrets.FB_SB_1 }}
          FB_C_USER_2: ${{ secrets.FB_C_USER_2 }}
          FB_XS_2: ${{ secrets.FB_XS_2 }}
          FB_DATR_2: ${{ secrets.FB_DATR_2 }}
          FB_FR_2: ${{ secrets.FB_FR_2 }}
          FB_SB_2: ${{ secrets.FB_SB_2 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          python pipeline.py
