name: LRT-2 Events Scraper Pipeline

# ---------------------------------------------------------------------------
# Schedule Strategy (free tier optimized & unified single-run scraping):
#
# Runs all LRT-2 stations (Eastbound + Westbound) in a single Apify batch call.
# Runs 3 times a day:
#   4:00 AM PHT (20:00 UTC)
#   11:00 AM PHT (03:00 UTC)
#   4:00 PM PHT (08:00 UTC)
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (Eastbound, Westbound, or all)'
        required: false
        default: 'all'

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/scraper/requirements.txt

      - name: Run Events Pipeline
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:  ${{ secrets.GEMINI_API_KEY_3 }}
          APIFY_API_TOKEN:   ${{ secrets.APIFY_API_TOKEN }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:    ${{ secrets.RECEIVER_EMAIL }}
        working-directory: ./external-data-scraper/scraper
        run: |
          BATCH="${{ github.event.inputs.batch || 'all' }}"
          echo "Running pipeline for Batch: ${BATCH}"
          python pipeline.py "${BATCH}"
