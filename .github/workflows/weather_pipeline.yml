name: Weather Pipeline

# ---------------------------------------------------------------------------
# Scheduling migrated to cron-job.org for exact-second precision.
# GitHub Actions cron was consistently late by several minutes.
#
# cron-job.org job "LRT Weather Pipeline" triggers workflow_dispatch via
# GitHub API every hour from 5:00 AM to 10:00 PM PHT (crontab: 0 5-22 * * *).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: # Triggered by cron-job.org or manually from GitHub UI

jobs:
  scrape-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/weather/requirements.txt

      - name: Run Weather Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        working-directory: ./external-data-scraper/weather
        run: |
          python pipeline.py
