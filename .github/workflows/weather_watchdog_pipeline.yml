name: Weather Watchdog Backup Pipeline

on:
  schedule:
    # Runs at :30 past every hour during LRT-2 operating hours (5:30 AM to 10:30 PM PHT / 21:30-14:30 UTC)
    - cron: '30 21-23,0-14 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  watchdog-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/weather/requirements.txt

      - name: Run Weather Watchdog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        working-directory: ./external-data-scraper/weather
        run: |
          python watchdog_pipeline.py
