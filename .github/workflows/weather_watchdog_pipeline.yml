name: Weather Watchdog Backup Pipeline
# ---------------------------------------------------------------------------
# Scheduling migrated to cron-job.org for exact-second precision.
# GitHub Actions cron was consistently late by several minutes.
#
# cron-job.org job "LRT Weather Watchdog" triggers workflow_dispatch via
# GitHub API at :30 mark hourly from 5:00 AM to 10:00 PM PHT
# (crontab: 30 5-22 * * *).
#
# This backup watchdog checks for stale weather data and re-fetches if needed.
# Can also be manually triggered via workflow_dispatch.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: # Triggered by cron-job.org or manually from GitHub UI

jobs:
  watchdog-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/weather/requirements.txt

      - name: Run Weather Watchdog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        working-directory: ./external-data-scraper/weather
        run: |
          python watchdog_pipeline.py
