name: Weather Watchdog Backup Pipeline
# ---------------------------------------------------------------------------
# NOT SCHEDULED — manual trigger only.
#
# The primary weather_pipeline.yml (scheduled via cron-job.org hourly 5AM-10PM
# PHT) already has 5x retries and 3-level fallbacks, making a scheduled
# watchdog unnecessary.
#
# Keep this workflow as an emergency tool — trigger manually from GitHub
# Actions if you ever notice stale weather data in the dashboard.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: # Manual trigger only from GitHub UI

jobs:
  watchdog-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external-data-scraper/weather/requirements.txt

      - name: Run Weather Watchdog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        working-directory: ./external-data-scraper/weather
        run: |
          python watchdog_pipeline.py
