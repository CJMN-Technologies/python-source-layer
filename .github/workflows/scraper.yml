name: LRT-2 Facebook Scraper

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 7 * * *'
    - cron: '0 16 * * 1,3,5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: external-data-scraper/scraper/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('external-data-scraper/scraper/requirements.txt') }}

      - name: Cache Tesseract
        uses: actions/cache@v4
        id: tesseract-cache
        with:
          path: /usr/share/tesseract-ocr
          key: tesseract-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r external-data-scraper/scraper/requirements.txt

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Run scraper
        env:
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd external-data-scraper/scraper
          python pipeline.py
