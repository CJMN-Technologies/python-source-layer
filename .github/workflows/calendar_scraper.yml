name: Academic Calendar Scraper

on:
  schedule:
    # Runs at 00:00 every 5 days
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to push changes back
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Calendar Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          FB_DATR: ${{ secrets.FB_DATR }}
          FB_FR: ${{ secrets.FB_FR }}
          FB_SB: ${{ secrets.FB_SB }}
          FB_C_USER_1: ${{ secrets.FB_C_USER_1 }}
          FB_XS_1: ${{ secrets.FB_XS_1 }}
          FB_DATR_1: ${{ secrets.FB_DATR_1 }}
          FB_FR_1: ${{ secrets.FB_FR_1 }}
          FB_SB_1: ${{ secrets.FB_SB_1 }}
          FB_C_USER_2: ${{ secrets.FB_C_USER_2 }}
          FB_XS_2: ${{ secrets.FB_XS_2 }}
          FB_DATR_2: ${{ secrets.FB_DATR_2 }}
          FB_FR_2: ${{ secrets.FB_FR_2 }}
          FB_SB_2: ${{ secrets.FB_SB_2 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python scraper/calendar_scraper.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update academic calendars [skip ci]"
          file_pattern: "scraper/academic_calendars.xlsx scraper/processed_calendars.json"
